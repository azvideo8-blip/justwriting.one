version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
        # typescript вынесен из пачки: подъём 5.8 → 5.9 ломает типы в
        # src/core/crypto/encrypt.ts (Uint8Array<ArrayBufferLike> против
        # BufferSource в WebCrypto), и в группе из 35 пакетов это выглядит как
        # «обновления красные», хотя красный ровно один. Отдельным PR видно,
        # что чинить, и остальные 34 не ждут крипто-правок.
        exclude-patterns:
          - "typescript"
          # eslint-plugin-react-hooks вынесен по той же причине: подъём до 7.1.1
          # добавляет 36 ошибок линта (set-state-in-effect и др. из
          # React-Compiler-сюиты). Это та же сюита, что дала OOM в AG-LINT-1.
          # В группе из тридцати пакетов такое читается как «обновления
          # красные», хотя красный один; отдельным PR видно, что чинить.
          - "eslint-plugin-react-hooks" 
    ignore:
      # Мажоры — руками, с открытым changelog.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # D-3 / F-064: зависимости службы на сервере. Отдельный каталог с отдельным
  # локом — пока манифест лежал одним файлом (`deploy/api-package.json`),
  # Dependabot его не видел вовсе, и CVE в jose не породил бы ни одного PR.
  # Версии здесь точные и обязаны совпадать с корневым локом: PR от Dependabot
  # поднимает версию только в этом каталоге, поэтому его нельзя мержить сам по
  # себе — сначала та же версия попадает в корень и на ней зелёнеют тесты.
  - package-ecosystem: npm
    directory: "/deploy/api"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
