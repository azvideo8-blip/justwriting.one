name: Выкатка на сервер

# Только по нажатию. Выкатка на каждый пуш означает, что незаконченная мысль,
# отправленная на сохранение, немедленно оказывается у людей — а веток здесь
# одна и push в неё делается по десять раз в день.
on:
  workflow_dispatch:
    inputs:
      what:
        description: Что выкатывать
        required: true
        default: both
        type: choice
        options: [both, client, api]

concurrency:
  group: deploy
  cancel-in-progress: false

# R4-8: выкатке достаточно читать репозиторий.
permissions:
  contents: read
  actions: read

jobs:
  deploy:
    # Свой раннер прямо на проде: только этот workflow — ручной
    # (workflow_dispatch), запускается человеком по требованию, а не
    # автоматически на каждый push. CI (автоматический, на каждый push/PR/
    # dependabot) остаётся на github-хостинге — вешать его туда же означало
    # бы непредсказуемую конкуренцию за память с живой базой.
    runs-on: [self-hosted, justwriting-vps]
    # R7Q-030: workflow_dispatch выбирает ветку в форме запуска, и с любой другой
    # ветки прогон получил бы те же секреты выкатки (SSH-ключ прода, JWT, адрес
    # и логин служебного аккаунта) и те же права на `sudo` на прод-машине.
    # Окружение production — заслонка мягкая: правила живут в настройках
    # репозитория и их можно снять одним кликом, а без них шаг вообще не помечен
    # как защищённый. Поэтому ветка записана здесь, в коде.
    if: github.ref == 'refs/heads/main'
    # R5-034: окружение production на GitHub пускает выкатку только из main.
    environment: production
    # R4-8: зависшая выкатка не держит очередь (cancel-in-progress: false) вечно.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # R3-017: 0.9.18 уехал при красном E2E — выкатка стартовала через секунду
      # после push и CI этого коммита не смотрела. Ждать CI здесь нельзя: он
      # идёт на том же раннере и стоял бы в очереди за выкаткой. Порядок —
      # сначала зелёный CI, потом кнопка.
      # R5-034: флага force больше нет — кнопка выкатки не обходит CI ни при
      # каких входах. Аварийный обход — руками на сервере, не из Actions.
      - name: CI этого коммита зелёный
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS_URL: https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=20
        run: |
          set -euo pipefail
          state=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$RUNS_URL" \
            | node -e 'const rs=(JSON.parse(require("fs").readFileSync(0,"utf8")).workflow_runs)||[];
            // R7Q-030: засчитывается только push этого коммита именно в main. В
            // прогонах с тем же sha есть PR-прогон (другие секреты, другой
            // merge-базис) и прогон той же сборки из рабочей ветки: раньше
            // брался workflow_runs[0] — самый свежий, и зелёный PR вместо push в
            // main выпускал код, который на main никто не проверял.
            const w=rs.find(r=>r.event==="push"&&r.head_branch==="main");
            console.log(w?`${w.status}/${w.conclusion}`:"none")')
          echo "CI $GITHUB_SHA: $state"
          if [ "$state" != "completed/success" ]; then
            echo "::error::CI этого коммита не зелёный ($state). Дождитесь зелёного CI."
            exit 1
          fi

      # R5-013/R5-021/R5-053: плановые gates.yml (секреты по всей истории,
      # мутации, живая БД) GitHub может не доставить — и пропуск не отличался
      # от зелёного. Здесь, у кнопки выкатки, он виден как ::warning::.
      - name: Свежесть ворот gates.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/gates-freshness.mjs

      - run: npm ci

      - name: Браузер для предрендера и проверки
        # R7F-024: `--with-deps` ставит системные пакеты через apt и требует sudo.
        # Раннер живёт на проде и состоит в sudo (это отдельный шаг владельца),
        # а прогон выкатки sudo не должен ни запрашивать, ни тем более что-то
        # доустанавливать в систему между шагами. Системные зависимости браузера
        # уже стоят (тот же chromium гоняется в gates.yml без --with-deps);
        # если их действительно нет — шаг падает здесь, а не после выкатки.
        run: npx playwright install chromium

      # Проверки до выкатки, а не после. Красный тест не должен доезжать до
      # сервера — это единственное, ради чего вообще стоит городить автоматику
      # вместо двух команд руками.
      - name: Типы
        run: npx tsc --noEmit
      - name: Тесты
        run: npx vitest run

      # Проверка после выкатки требует двух секретов. Раньше их отсутствие она
      # печатала как «пропущено» и выкатка была зелёной — проверка, которая не
      # исполняется, ничем не отличается от отсутствующей (AG-BILL-3). Теперь
      # она падает, а падение после выкатки поднимает откат: конфигурационная
      # ошибка откатывала бы исправную выкатку и оставляла прод на предыдущем
      # бандле. Поэтому спрашиваем ЗДЕСЬ — до того, как что-либо уехало на
      # сервер: нечего выкатывать, нечего и откатывать.
      - name: Секреты проверки после выкатки
        env:
          SMOKE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SMOKE_UID: ${{ secrets.SMOKE_UID }}
          SMOKE_LOGIN_EMAIL: ${{ secrets.SMOKE_LOGIN_EMAIL }}
          SMOKE_LOGIN_PASSWORD: ${{ secrets.SMOKE_LOGIN_PASSWORD }}
        run: |
          # Шаг исполняется под `bash -e`: конструкция `[ ... ] && x=y` вернула
          # бы 1, когда условие ложно, и уронила бы шаг ровно тогда, когда
          # секреты НА МЕСТЕ. Поэтому только if-блоки.
          missing=""
          if [ -z "$SMOKE_JWT_SECRET" ]; then missing="$missing SUPABASE_JWT_SECRET"; fi
          if [ -z "$SMOKE_UID" ]; then missing="$missing SMOKE_UID"; fi
          if [ -z "$SMOKE_LOGIN_EMAIL" ]; then missing="$missing SMOKE_LOGIN_EMAIL"; fi
          if [ -z "$SMOKE_LOGIN_PASSWORD" ]; then missing="$missing SMOKE_LOGIN_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты репозитория:$missing"
            echo "Проверка обрыва стрима после выкатки без них не выполняется," >&2
            echo "а невыполненная проверка не должна выглядеть пройденной." >&2
            echo "Заведите их в Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          echo "секреты проверки на месте"

      - name: Сборка клиента
        if: inputs.what != 'api'
        # Эти два значения вшиваются в бандл на сборке, а не читаются в рантайме.
        # Без них приложение падает при первом же обращении к базе — и падает
        # тихо: сборка проходит, выкатка проходит, сайт отдаёт 200, а человек
        # видит «что-то пошло не так». Так и случилось 21 августа при первом
        # запуске выкатки из Actions: локальные сборки брали их из .env.production,
        # которого в раннере нет. Оба значения публичны — они и так лежат в
        # выложенном бандле.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          # Заслонка: бандл без настроек базы не должен доезжать до сервера.
          # Проверяем результат сборки, а не наличие переменных: важно, что
          # значение попало внутрь, а не что оно было объявлено.
          # Пустое значение проверяется отдельно и первым: grep по пустой строке
          # совпадает со всем, то есть незаданный секрет прошёл бы заслонку.
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "секреты VITE_SUPABASE_URL и VITE_SUPABASE_ANON_KEY не заданы" >&2
            exit 1
          fi
          if ! grep -rqF "$VITE_SUPABASE_URL" dist/assets/*.js; then
            echo "в бандле нет адреса базы — выкатка остановлена" >&2
            echo "проверьте секреты VITE_SUPABASE_URL и VITE_SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          echo "настройки базы в бандле на месте"
          # G-4 / F-002: хэш собранного index.html. Им сверяется проверка после
          # выкатки: номер версии не отличает удачную копию от неудачной при
          # перевыкатке того же номера.
          INDEX_SHA256=$(sha256sum dist/index.html | cut -d' ' -f1)
          if [ -z "$INDEX_SHA256" ]; then
            echo "не удалось посчитать sha256 dist/index.html" >&2
            exit 1
          fi
          echo "sha256 dist/index.html = $INDEX_SHA256"
          echo "INDEX_SHA256=$INDEX_SHA256" >> "$GITHUB_ENV"

      # R7F-024: ключ появляется ровно там, где его начинают читать. До этого
      # шага прогон — сборка и проверки, которым приватный ключ прода не нужен;
      # раньше он лежал в $RUNNER_TEMP с самого начала (типы, тесты, npm ci,
      # сборка — десятки минут), и любая подстановка `${{ }}` в любом из этих
      # шагов могла его отдать. Шаг без `if`: при what = api выкатка клиента
      # пропускается, а службе ключ нужен сразу следующим шагом.
      - name: Ключ доступа
        run: |
          # EA-11: раннер живёт на проде — ключ во временном каталоге прогона,
          # а не в ~/.ssh пользователя, и удаляется в конце при любом исходе.
          umask 077
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > "$RUNNER_TEMP/deploy_key"
          # Отпечаток хоста заранее, а не TOFU: иначе первый же перехват
          # соединения останется незамеченным.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > "$RUNNER_TEMP/known_hosts"
          echo "DEPLOY_SSH=ssh -i $RUNNER_TEMP/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          echo "DEPLOY_SCP=scp -i $RUNNER_TEMP/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Выкатка клиента
        id: deploy_client
        if: inputs.what != 'api'
        run: |
          # R4-8: карты исходников (sourcesContent) на сервер не едут вовсе — раньше
          # их прятала от посетителей одна строка nginx.
          find dist -name '*.map' -delete
          # EA-11: свой каталог (mktemp, 0700), а не общий предсказуемый /tmp/dist-new.
          REMOTE_DIR=$($DEPLOY_SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'mktemp -d /tmp/jw-dist.XXXXXX')
          # Каталог создан — убирать его надо и при падении rsync, до heredoc с
          # его собственной ловушкой (R3 §4.1.1 j).
          trap '$DEPLOY_SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "rm -rf $REMOTE_DIR" || true' EXIT
          # R5-049: метаданные Finder в публичный корень не едут.
          rsync -az --delete --exclude .DS_Store -e "$DEPLOY_SSH" dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_DIR/
          # Без --delete: страница, открытая до выкатки, продолжает подгружать
          # куски своего бандла. Удаление ломает приложение у того, кто в этот
          # момент пишет. Имена кусков содержат хэш, поэтому старые и новые не
          # мешают друг другу; лишнее подчищается по возрасту.
          # Перед копированием сохраняем index.html и sw.js для полного отката.
          $DEPLOY_SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "REMOTE_DIR=$REMOTE_DIR bash -s" <<'REMOTE'
            set -euo pipefail
            # Падение шага не должно оставлять каталог в /tmp на сервере.
            trap 'rm -rf "$REMOTE_DIR"' EXIT
            if [ -f /var/www/justwriting/index.html ]; then
              sudo cp /var/www/justwriting/index.html /var/www/justwriting/index.html.prev
            fi
            if [ -f /var/www/justwriting/sw.js ]; then
              sudo cp /var/www/justwriting/sw.js /var/www/justwriting/sw.js.prev
            fi
            # Шаблоны писем едут в dist из public/email. Прежняя подмена из
            # /opt/justwriting/email-templates (каталога там нет) предупреждала
            # на каждой выкатке и могла бы молча вернуть устаревшие шаблоны.
            sudo rsync -a "$REMOTE_DIR"/ /var/www/justwriting/
            sudo chown -R www-data:www-data /var/www/justwriting
            rm -rf "$REMOTE_DIR"
          REMOTE

      - name: Сборка и выкатка службы
        id: deploy_api
        if: inputs.what != 'client'
        run: |
          npx esbuild api/server.ts --bundle --platform=node --format=esm \
            --target=node20 --packages=external --outfile="$RUNNER_TEMP/server.mjs"
          # Firebase в бандле означает, что служба не поднимется: на сервере
          # этого пакета нет и быть не должно. Дешевле поймать здесь.
          if grep -q firebase "$RUNNER_TEMP/server.mjs"; then
            echo "в бандле есть firebase — выкатка остановлена" >&2
            exit 1
          fi
          # Сборка с --packages=external оставляет импорты как есть, поэтому
          # пакет, добавленный в коде, но не вписанный в зависимости службы,
          # роняет её при старте. Так уже было: jose приехала в api/auth.ts,
          # а в package.json службы её не было. Сверяем до выкатки.
          node -e '
            const fs = require("fs");
            const bundle = fs.readFileSync(process.env.RUNNER_TEMP + "/server.mjs", "utf8");
            const declared = new Set(Object.keys(
              JSON.parse(fs.readFileSync("deploy/api/package.json", "utf8")).dependencies
            ));
            const missing = [...bundle.matchAll(/^import[^;]*?from\s*"([^"]+)"/gm)]
              .map(m => m[1])
              .filter(s => !s.startsWith(".") && !s.startsWith("node:"))
              .map(s => s.startsWith("@") ? s.split("/").slice(0, 2).join("/") : s.split("/")[0])
              .filter(s => !require("module").builtinModules.includes(s))
              .filter(s => !declared.has(s));
            if (missing.length) {
              console.error("нет в deploy/api/package.json: " + [...new Set(missing)].join(", "));
              process.exit(1);
            }
            console.log("все внешние импорты бандла объявлены");
          '
          # D-3 / F-043: манифест службы лежит в своём каталоге вместе с локом.
          # Пока это был один файл без lock-файла, выкатка ставила «что найду по
          # диапазону», и на сервере оказывались версии, на которых CI не тестировал
          # (ai 6.0.257 против 6.0.191 в корне). Лок рядом с манифестом нужен ещё и
          # потому, что Dependabot смотрит на каталог, а не на отдельный файл.
          # EA-11: свой каталог (mktemp, 0700), а не общие /tmp/server.mjs и /tmp/api-package.json.
          REMOTE_DIR=$($DEPLOY_SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'mktemp -d /tmp/jw-api.XXXXXX')
          trap '$DEPLOY_SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "rm -rf $REMOTE_DIR" || true' EXIT
          $DEPLOY_SCP "$RUNNER_TEMP/server.mjs" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_DIR/server.mjs
          $DEPLOY_SCP deploy/api/package.json \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_DIR/api-package.json
          $DEPLOY_SCP deploy/api/package-lock.json \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_DIR/api-package-lock.json
          # M-3: снимок прошлого прогона (не дошёл до очистки) убираем первым:
          # провал npm ci ниже иначе откатил бы живые зависимости на него.
          # R5-009: и свежий server.mjs.prev снимаем ДО отметки swapped, отдельным
          # вызовом. Внутри удалённого блока сбой копии (ENOSPC) при уже
          # выставленной отметке откатывал на .prev прошлой выкатки — релиз назад.
          $DEPLOY_SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            sudo rm -rf /opt/justwriting/api/node_modules.prev /opt/justwriting/api/package.json.prev /opt/justwriting/api/package-lock.json.prev &&
            sudo cp /opt/justwriting/api/server.mjs /opt/justwriting/api/server.mjs.prev'
          # M-4: откат ниже только после этой отметки. Сбой раньше (сборка, scp,
          # снимок) не трогал прод, а server.mjs.prev там мог быть старше живой.
          echo "swapped=1" >> "$GITHUB_OUTPUT"
          $DEPLOY_SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "REMOTE_DIR=$REMOTE_DIR bash -s" <<'REMOTE'
            set -euo pipefail
            # Падение шага не должно оставлять каталог (и staging с npm-деревом)
            # в /tmp на сервере.
            trap 'rm -rf "$REMOTE_DIR"' EXIT
            # npm ci, а не npm install: ставит ровно то, что записано в локе, и
            # падает, если лок и манифест расходятся. Ставится в отдельный каталог:
            # ci сначала сносит node_modules, и провал установки прямо в
            # /opt/justwriting/api оставил бы службу без зависимостей — а откат
            # ниже перезапускает её и получил бы мёртвый процесс. Готовое дерево
            # подменяется rsync'ом, когда установка уже прошла.
            mkdir -p "$REMOTE_DIR"/stage &&
            cp "$REMOTE_DIR"/api-package.json "$REMOTE_DIR"/stage/package.json &&
            cp "$REMOTE_DIR"/api-package-lock.json "$REMOTE_DIR"/stage/package-lock.json &&
            # Кэш — у пользователя выкатки: в /opt/justwriting/api ему писать нельзя.
            env npm_config_cache="$HOME/.npm-cache-jw-api" \
              npm ci --prefix "$REMOTE_DIR"/stage --omit=dev --no-audit --no-fund &&
            # L-9 (R4-064): снимок старого дерева перед подменой (жёсткие
            # ссылки, тот же том). Откат ниже восстанавливает и зависимости:
            # rsync --delete уже снёс прежние, а server.mjs без своих пакетов
            # не поднимется.
            sudo cp -al /opt/justwriting/api/node_modules /opt/justwriting/api/node_modules.prev &&
            sudo cp /opt/justwriting/api/package.json /opt/justwriting/api/package.json.prev &&
            sudo cp /opt/justwriting/api/package-lock.json /opt/justwriting/api/package-lock.json.prev &&
            sudo rsync -a --delete "$REMOTE_DIR"/stage/node_modules/ /opt/justwriting/api/node_modules/ &&
            sudo cp "$REMOTE_DIR"/stage/package.json "$REMOTE_DIR"/stage/package-lock.json /opt/justwriting/api/ &&
            sudo chown -R justwriting:justwriting /opt/justwriting/api/node_modules /opt/justwriting/api/package.json /opt/justwriting/api/package-lock.json &&
            sudo cp "$REMOTE_DIR"/server.mjs /opt/justwriting/api/server.mjs &&
            sudo chown justwriting:justwriting /opt/justwriting/api/server.mjs &&
            rm -rf "$REMOTE_DIR" &&
            sudo systemctl restart justwriting && sleep 5 &&
            systemctl is-active --quiet justwriting
          REMOTE

      - name: Проверка после выкатки
        env:
          SMOKE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SMOKE_UID: ${{ secrets.SMOKE_UID }}
          # Пусто, если клиент в этом прогоне не выкатывался (what = api):
          # проверка тогда не молчит, а явно пишет, что сверку пропустили.
          EXPECTED_INDEX_SHA256: ${{ env.INDEX_SHA256 }}
          # what = api: клиент не выкатывался, на странице прежняя версия — сверять
          # её с src/version.ts этого прогона значит уронить и откатить здоровый API.
          SMOKE_CLIENT_DEPLOYED: ${{ inputs.what != 'api' }}
        run: npx tsx scripts/post-deploy-smoke.ts https://justwriting.ru/

      # TB-17: настоящий вход служебным аккаунтом — неверный пароль отклонён,
      # верный открывает экран письма. Падение поднимает откат, как и выше.
      - name: Проверка входа после выкатки
        env:
          SMOKE_LOGIN_EMAIL: ${{ secrets.SMOKE_LOGIN_EMAIL }}
          SMOKE_LOGIN_PASSWORD: ${{ secrets.SMOKE_LOGIN_PASSWORD }}
        run: npx tsx scripts/post-deploy-login.ts https://justwriting.ru/

      # M-3: снимок зависимостей удаляется только после проверки входа — откат
      # после упавшей проверки иначе остаётся без node_modules.prev.
      - name: Очистка снимка службы
        if: success() && inputs.what != 'client'
        run: |
          $DEPLOY_SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            sudo rm -rf /opt/justwriting/api/node_modules.prev /opt/justwriting/api/package.json.prev /opt/justwriting/api/package-lock.json.prev'

      # F-047: старые ассеты удаляются только после того, как релиз прошёл проверку входа.
      # Если проверка упадёт и сработает откат к index.html.prev, его бандлы старше 14 дней
      # останутся на месте и пользователи не получат 404.
      - name: Очистка устаревших ассетов клиента
        if: success() && inputs.what != 'api'
        run: |
          $DEPLOY_SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            sudo find /var/www/justwriting/assets -type f -mtime +14 -delete'

      # Объявление в теме «Новости» группы в Telegram — только после проверок.
      # Сбой объявления выкатку не роняет: скрипт выходит с 0, а на случай
      # падения самого tsx — continue-on-error. Иначе failure() поднял бы откат
      # уже проверенного релиза, когда node_modules.prev уже удалён.
      - name: Объявление о выпуске
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
        run: npx tsx scripts/announce-release.ts

      # Если служба не поднялась или проверка после выкатки упала — возвращаем
      # предыдущий бандл службы, а не оставляем сервис лежать.
      # Только если подмена службы реально начиналась (swapped=1): упавшие
      # «Типы», «Тесты» или сборка до неё раньше тоже поднимали откат и
      # возвращали прод на .prev.
      - name: Откат службы при сбое
        if: failure() && inputs.what != 'client' && steps.deploy_api.outputs.swapped == '1'
        run: |
          $DEPLOY_SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            if [ -f /opt/justwriting/api/server.mjs.prev ]; then
              sudo cp /opt/justwriting/api/server.mjs.prev /opt/justwriting/api/server.mjs;
            fi;
            if [ -d /opt/justwriting/api/node_modules.prev ]; then
              sudo rsync -a --delete /opt/justwriting/api/node_modules.prev/ /opt/justwriting/api/node_modules/ &&
              sudo cp /opt/justwriting/api/package.json.prev /opt/justwriting/api/package.json &&
              sudo cp /opt/justwriting/api/package-lock.json.prev /opt/justwriting/api/package-lock.json &&
              sudo rm -rf /opt/justwriting/api/node_modules.prev /opt/justwriting/api/package.json.prev /opt/justwriting/api/package-lock.json.prev &&
              echo "откат зависимостей выполнен";
            fi;
            sudo systemctl restart justwriting && echo "откат службы выполнен"'

      # Если проверка после выкатки клиента упала — возвращаем index.html и sw.js.
      # Старые бандлы в assets сохранены благодаря ротации по возрасту, поэтому
      # откат index.html и sw.js мгновенно возвращает работоспособную версию для людей.
      - name: Откат клиента при сбое
        if: failure() && inputs.what != 'api' && steps.deploy_client.outcome != 'skipped' && steps.deploy_client.outcome != ''
        run: |
          $DEPLOY_SSH ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            if [ -f /var/www/justwriting/index.html.prev ]; then
              sudo cp /var/www/justwriting/index.html.prev /var/www/justwriting/index.html;
            fi &&
            if [ -f /var/www/justwriting/sw.js.prev ]; then
              sudo cp /var/www/justwriting/sw.js.prev /var/www/justwriting/sw.js;
            fi &&
            sudo chown www-data:www-data /var/www/justwriting/index.html /var/www/justwriting/sw.js 2>/dev/null || true;
            echo "откат клиента выполнен: восстановлены index.html.prev и sw.js.prev"'

      - name: Убрать ключ доступа
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/server.mjs"
