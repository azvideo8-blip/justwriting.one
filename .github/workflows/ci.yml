name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Минуты GitHub кончаются (2026-09-27): push гоняется на своём раннере на VPS
# бесплатно. Машины GitHub — только вручную (мажорный релиз: Run workflow →
# hosted) и для pull_request: чужой код из PR (dependabot) на прод-сервере не
# исполняется.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master ]
    # PR от Dependabot не гоняются вовсе (см. `if:` у джобов): на машинах
    # GitHub это минуты за каждый недельный PR, а на прод-раннере — чужой код.
    # Обновления зависимостей идут пачкой руками: корень и deploy/api вместе
    # (тест AG-DEPS-1 держит их равными), прогон — на своём раннере при push.
  workflow_dispatch:
    inputs:
      hosted:
        description: 'Гнать на машинах GitHub (мажорный релиз)'
        type: boolean
        default: false

jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.hosted) && 'ubuntu-latest' || fromJSON('["self-hosted","justwriting-vps"]') }}
    env:
      # На VPS :3000 — прод-API, :3100 — стенд из gates.yml; E2E берёт свой порт.
      E2E_PORT: '3200'
      # Клиент живёт на Supabase: без этих двух getSupabase() бросает на старте,
      # и E2E падает 17 тестами из 19 (проверено локально 2026-08-21 — выживают
      # только два теста лендинга). Секреты в репозитории заведены с 21 августа,
      # но к этому джобу подключены не были: шаг E2E ни разу не выполнялся,
      # потому что джоб умирал раньше на пороге покрытия.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # fetch-depth: 0 — скан секретов (C-3) читает диапазон выкладки; при
      # глубине 1 у раннера нет коммита, от которого считать.
      with:
        fetch-depth: 0
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    # C-3 / F-042: каждый push в main проверяется на секреты. Полную историю
    # здесь не сканируют намеренно: диапазон выкладки дешёв, а полная история
    # живёт отдельным джобом по расписанию (gates.yml, B-4 / R2-017).
    # Версия gitleaks, sha256 и сам запуск — в scripts/gitleaks-scan.sh: один
    # источник правды для обоих мест, иначе пин при подъёме разъезжается.
    - name: Secret scan (gitleaks)
      env:
        GL_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.sha) || format('{0}..{1}', github.event.before, github.sha) }}
      run: |
        set -euo pipefail
        ZERO=0000000000000000000000000000000000000000
        FROM="${GL_RANGE%%..*}"
        # Свежая ветка (before — нули) и force-push (before уже не предок) —
        # проверяем хотя бы выгруженный коммит, а не всю историю.
        if [ "$FROM" = "$ZERO" ] || ! git cat-file -e "${FROM}^{commit}" 2>/dev/null \
           || ! git merge-base --is-ancestor "$FROM" HEAD 2>/dev/null; then
          LOG_OPTS="-1 ${GITHUB_SHA}"
        else
          LOG_OPTS="$GL_RANGE"
        fi
        bash scripts/gitleaks-scan.sh "$LOG_OPTS"
    # R5-003: deploy/nginx.conf едет на сервер руками — `nginx -t` здесь, а не
    # на живом nginx. Контейнер nginx той же версии, что на проде.
    - name: nginx -t (deploy/nginx.conf)
      run: bash scripts/ci/nginx-check.sh
    - run: npm ci
    - run: node scripts/prod-audit.mjs  # gate on shipped (prod) deps; fails on any high/critical advisory except the documented N/A exceptions in the script
    - run: npm run typecheck
    - run: npm run lint
    - run: npm run i18n:audit
    - name: Dead-code ratchet (G-2 / F-050)
      # С T-2 (2026-09-28) baseline пуст: любое новое нарушение knip красит прогон.
      # scripts/knip-baseline.txt остаётся механизмом, а не складом долга.
      run: node scripts/knip-check.mjs
    - name: Cross-feature ratchet (AUDIT-part3 9, v2 detection)
      run: bash scripts/cross-feature-check.sh
    - name: Raw overlay gate (AUDIT-part2 3.1, AG-GATE-1)
      run: bash scripts/raw-overlay-check.sh
    - run: npm run test:ci
    # S-42.3: каждый паттерн детектора кризиса держится хотя бы одной фразой корпуса.
    - name: Crisis pattern coverage (S-42)
      run: npx tsx scripts/crisis-pattern-coverage.mjs
    # EA-8: браузер ставится ДО сборки — иначе пререндер внутри build молча
    # пропускался, и бюджет размера мерил не ту сборку, что уезжает на сервер.
    - name: Install Playwright
      run: npx playwright install chromium
    - run: npm run build
    - name: Bundle size report
      run: |
        echo "=== Bundle size report ==="
        ls -lh dist/assets/*.js | awk '{print $5, $9}' | sort -rn | head -15
    - name: Bundle size budget
      run: |
        # Храповик, а не цель: 720000 — фактический вес на 2026-08-23 (712700)
        # с округлением вверх до 10 КБ. Снижен с 810000 после DEBT-1: из index-чанка
        # ушли переводы второстепенных i18n-пространств и два модальных окна
        # (React.lazy), плюс дерево Firebase. Порог только опускать.
        # Порог по сырым байтам. 2026-08-25: пересчитан от факта.
        # Прежние 720000 были поставлены 2026-08-23 (ba73b86b) НИЖЕ реального
        # размера — сборка в тот же день весила 720301, и гейт не проходил
        # ни разу: CI на main был красным подряд от него, а не от роста бандла.
        # Порог от замера 720507 + ~2% запаса. Основной размерный гейт —
        # gzip ниже (225000 при факте 210583): к людям едет он, сырые байты
        # держим за цену разбора. Поднимать этот порог можно только вместе с
        # замером и строкой о том, что именно выросло.
        # 2026-09-03: 735000 → 750000. Факт 738278 против 720301, когда порог
        # ставили: +18 КБ за тринадцать выпусков работы по синхронизации,
        # изоляции аккаунтов и разрешению конфликтов. Проверено, что рост не
        # от заехавшего не туда: minisearch, docx, jspdf, mammoth и posthog
        # в стартовом куске отсутствуют, стенд сбоев в сборку не попал.
        # Gzip при этом 215115 из 225000 — порог, который едет к людям, не
        # тронут и остаётся связывающим.
        # История: 700000 → 750000 → 760000, и на третьем разе вместо
        # четвёртого поднятия сделана работа, о которой там же и было
        # написано: клиент Supabase вынесен из основного куска отдельным
        # vendor-supabase. Кусок упал с 777559 до 560871, сжатый — с 224432
        # до 167883. Потолки опущены вслед за этим: храповик обязан ходить
        # вниз, иначе он перестаёт что-либо держать.
        # 2026-09-24: 600000 → 590000. Кусок дорос до 614762 и уронил CI; вместо
        # поднятия из старта вынесены сервис восстановления ИИ, окно политики и
        # вкладка настроек редактора (lazy) — стало 573915, gzip 169178.
        # 2026-09-28: 590000 → 420000. React (react, react-dom, scheduler) вынесен в
        # vendor-react — он живёт в кэше браузера между выкатками, а index-кусок
        # упал с 601811 до 405021 (gzip 117163). Заодно react-dom 19.3 (+28 КБ)
        # перестал упираться в порог. Храповик опущен вслед за фактом.
        MAX_INDEX=420000   # index-*.js fail-порог (байты)
        # R3-045: vendor был только предупреждением, а суммы не мерил никто —
        # новый чанк рос без гейта. 2026-09-30: самый большой vendor 363372
        # (docx), весь JS 3783407 в 97 файлах. Потолки — с запасом ~5–10%.
        MAX_VENDOR=400000  # vendor-*.js fail-порог
        MAX_TOTAL_JS=4000000  # сумма dist/assets/*.js fail-порог
        MAX_CSS=185000     # *.css fail-порог (байты)
        fail=0
        for f in dist/assets/index-*.js; do
          sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
          echo "index: $f = $sz"
          [ "$sz" -gt "$MAX_INDEX" ] && { echo "::error::$f > $MAX_INDEX"; fail=1; }
        done
        for f in dist/assets/vendor-*.js; do
          sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
          [ "$sz" -gt "$MAX_VENDOR" ] && { echo "::error::$f > $MAX_VENDOR ($sz)"; fail=1; }
        done
        total_js=$(cat dist/assets/*.js | wc -c | tr -d ' ')
        echo "total js: $total_js"
        [ "$total_js" -gt "$MAX_TOTAL_JS" ] && { echo "::error::total js $total_js > $MAX_TOTAL_JS"; fail=1; }
        for f in dist/assets/*.css; do
          sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
          echo "css: $f = $sz"
          [ "$sz" -gt "$MAX_CSS" ] && { echo "::error::$f > $MAX_CSS"; fail=1; }
        done
        # AUDIT-H7: gzip-гейт на САМЫЙ БОЛЬШОЙ index-чанк. Порог от факта
        # 2026-08-24: entry 209.63 KB gzip, запас ~5%. dist/assets/index-*.js
        # матчит два файла — берём max, иначе gzip -c склеит их и посчитает не то.
        MAX_INDEX_GZ=121000
        biggest_gz=0
        for f in dist/assets/index-*.js; do
          gz=$(gzip -c "$f" | wc -c)
          [ "$gz" -gt "$biggest_gz" ] && biggest_gz=$gz
        done
        echo "index gzip (largest chunk): $biggest_gz"
        [ "$biggest_gz" -gt "$MAX_INDEX_GZ" ] && { echo "::error::largest index chunk gzip $biggest_gz > $MAX_INDEX_GZ"; fail=1; }
        exit $fail
    - name: E2E test discovery check
      run: |
        OUTPUT=$(npx playwright test --list --project=chromium)
        echo "$OUTPUT"
        echo "$OUTPUT" | grep -q "Total: [1-9][0-9]* tests" || { echo "::error::Playwright test discovery failed or found 0 tests"; exit 1; }
    - name: E2E Tests
      run: npx playwright test --project=chromium
  # Сравнение размера бандла живёт отдельно от гейтов корректности намеренно.
  # Раньше оно стояло в середине job build и переключало checkout на main
  # (git checkout <ref> -- . перезаписывает индекс, поэтому git checkout -- .
  # возвращал base повторно). Всё, что шло после, — бюджет размера, E2E,
  # функции, правила Firestore — проверяло main вместо PR.
  
  rls:
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.hosted) && 'ubuntu-latest' || fromJSON('["self-hosted","justwriting-vps"]') }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Apply schema and run RLS tests
      run: |
        # Все миграции по порядку, а не первые три. Тест проверяет поведение,
        # которое вводится позже: ограничение роли при вставке приходит из
        # 0009, а профиль при регистрации заводит триггер из 0006. С обрезанным
        # набором проверка роли проваливалась, потому что политики из 0009
        # в базе просто не было.
        # psql — внутри контейнера сервиса: на VPS-раннере клиента Postgres нет,
        # а порт наружу не публикуется (5432 там — Supavisor прода).
        { for f in supabase/tests/_auth_setup.sql supabase/migrations/*.sql supabase/tests/rls.test.sql; do cat "$f"; echo; done; } \
          | docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1

  # R5-008: джоб только для PR не от Dependabot. Сегодня таких нет (владелец
  # пушит в main), поэтому он не исполнялся ни разу — но и не мёртв: первый
  # же PR человека (репозиторий готовится к публичности) его запустит.
  # Размерный гейт каждого push — «Bundle size budget» в build; здесь лишь
  # сравнение с базой PR.
  bundle-size:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'   # тот же мажор, что и в job build
        cache: 'npm'

    # M-5: без playwright предрендер в CI бросает (prerender.ts, L-9). Здесь он
    # не нужен — сравниваются только dist/assets, их предрендер не меняет.
    - name: Build PR
      run: |
        npm ci
        CI= npm run build
        mkdir -p /tmp/current-dist
        cp -r dist/assets/* /tmp/current-dist/

    - name: Build base in a separate worktree
      run: |
        git worktree add /tmp/base "origin/${{ github.base_ref }}"
        cd /tmp/base
        npm ci
        CI= npm run build
        mkdir -p /tmp/base-dist
        cp -r /tmp/base/dist/assets/* /tmp/base-dist/

    - name: Compare
      run: npx tsx scripts/bundle-compare.ts /tmp/base-dist /tmp/current-dist
