name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # R7F-028: отмена в процессе — только для pull request, где новый коммит делает
  # старый прогон бессмысленным. Push в main не отменяется никогда: второй пуш
  # подряд убивал прогон первого коммита на середине, и у этого коммита (а им
  # чаще всего и есть релизный) не оставалось ни зелёного, ни красного verdict —
  # только `cancelled`. Выкатка по такому sha не может ни пройти, ни объяснять
  # отказ, а человек видит, что «CI был и пропал».
  # 2026-10-18 (решение владельца): CI гоняется и на рабочих ветках — ошибки
  # ловятся до main. Раннер один, поэтому новый пуш в ту же ветку отменяет её
  # старый прогон; main по-прежнему не отменяется никогда (R7F-028), а выкатка
  # засчитывает только push в main (deploy.yml, R7Q-030).
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

# 2026-11-20 (решение владельца): всё на машинах GitHub. Свой раннер на проде
# снят: CI исполняет код любой ветки, а раннер жил рядом с базой и в группе
# docker (= root). Порты ниже (E2E_PORT, стенд mobile-e2e) остались не
# дефолтными с тех времён — на чистой машине они просто свободны.
on:
  push:
    branches: [ '**', '!dependabot/**' ]
  pull_request:
    branches: [ main, master ]
    # PR от Dependabot не гоняются вовсе (см. `if:` у джобов): на машинах
    # GitHub это минуты за каждый недельный PR.
    # Обновления зависимостей идут пачкой руками: корень и deploy/api вместе
    # (тест AG-DEPS-1 держит их равными), прогон — при push.
  workflow_dispatch:

jobs:
  # Решение владельца 2026-10-20: push в main с деревом, которое уже прошло ПОЛНЫЙ
  # CI на рабочей ветке (выпуск: ветка зеленеет, потом тот же код одним коммитом
  # в main), тяжёлые джобы не повторяет — scripts/ci/already-green.mjs. Строго:
  # двойник — только push-прогон ci.yml не на main, успех, то же дерево, все
  # тяжёлые джобы success. Сбой или неясность — полный прогон. Шлагбаум выкатки
  # (deploy.yml: зелёный push-прогон этого sha в main) не меняется.
  already-green:
    if: github.actor != 'dependabot[bot]' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.twin.outputs.run }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    # Проверка коммита 5fbab718: на ветке gitleaks видел только свой push (у
    # свежей ветки — один коммит), а полный диапазон выпуска проверял прогон на
    # main, который теперь может пропустить build. Поэтому скан диапазона
    # main (before..sha) — здесь, всегда и ДО поиска двойника: нашёл секрет —
    # джоб красный, двойник не выдаётся, build идёт и тоже краснеет.
    - name: Secret scan (gitleaks, диапазон main)
      run: |
        set -euo pipefail
        FROM="${{ github.event.before }}"
        if [ "$FROM" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${FROM}^{commit}" 2>/dev/null \
           || ! git merge-base --is-ancestor "$FROM" HEAD 2>/dev/null; then
          LOG_OPTS="-1 ${GITHUB_SHA}"
        else
          LOG_OPTS="${FROM}..${GITHUB_SHA}"
        fi
        bash scripts/gitleaks-scan.sh "$LOG_OPTS"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - id: twin
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/ci/already-green.mjs

  build:
    needs: already-green
    # `!cancelled()`: джоб идёт и когда already-green пропущен (не main) или упал
    # (сбой — значит полный прогон, а не пропуск тестов).
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && needs.already-green.outputs.run == '' }}
    runs-on: ubuntu-latest
    env:
      E2E_PORT: '3200'
      # Клиент живёт на Supabase: без этих двух getSupabase() бросает на старте,
      # и E2E падает 17 тестами из 19 (проверено локально 2026-08-21 — выживают
      # только два теста лендинга). Секреты в репозитории заведены с 21 августа,
      # но к этому джобу подключены не были: шаг E2E ни разу не выполнялся,
      # потому что джоб умирал раньше на пороге покрытия.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # fetch-depth: 0 — скан секретов (C-3) читает диапазон выкладки; при
      # глубине 1 у раннера нет коммита, от которого считать.
      with:
        fetch-depth: 0
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    # C-3 / F-042: каждый push в main проверяется на секреты. Полную историю
    # здесь не сканируют намеренно: диапазон выкладки дешёв, а полная история
    # живёт отдельным джобом по расписанию (gates.yml, B-4 / R2-017).
    # Версия gitleaks, sha256 и сам запуск — в scripts/gitleaks-scan.sh: один
    # источник правды для обоих мест, иначе пин при подъёме разъезжается.
    - name: Secret scan (gitleaks)
      env:
        GL_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.sha) || format('{0}..{1}', github.event.before, github.sha) }}
      run: |
        set -euo pipefail
        ZERO=0000000000000000000000000000000000000000
        FROM="${GL_RANGE%%..*}"
        # Свежая ветка (before — нули) и force-push (before уже не предок):
        # раньше сканировался один коммит `-1 HEAD`, и секрет, добавленный в
        # ветку раньше последнего коммита, проходил. B-5: сравниваем с main.
        # origin/main нужен в refs — checkout с fetch-depth: 0 его не гарантирует.
        if [ "$FROM" = "$ZERO" ] || ! git cat-file -e "${FROM}^{commit}" 2>/dev/null \
           || ! git merge-base --is-ancestor "$FROM" HEAD 2>/dev/null; then
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main || true
          # Ревью: на main (force-push, ручной запуск) origin/main = HEAD и диапазон
          # пуст — gitleaks прошёл бы, ничего не проверив. Пусто — хотя бы HEAD.
          if git rev-parse --verify --quiet origin/main >/dev/null \
             && [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            LOG_OPTS="origin/main..HEAD"
          else
            LOG_OPTS="-1 ${GITHUB_SHA}"
          fi
        else
          LOG_OPTS="$GL_RANGE"
        fi
        bash scripts/gitleaks-scan.sh "$LOG_OPTS"
    # R5-003: deploy/nginx.conf едет на сервер руками — `nginx -t` здесь, а не
    # на живом nginx. Контейнер nginx той же версии, что на проде.
    - name: nginx -t (deploy/nginx.conf)
      run: bash scripts/ci/nginx-check.sh
    - run: npm ci
    - run: node scripts/prod-audit.mjs  # gate on shipped (prod) deps; fails on any high/critical advisory except the documented N/A exceptions in the script
    - run: npm run typecheck
    - run: npm run lint
    - run: npm run i18n:audit
    - name: Dead-code ratchet (G-2 / F-050)
      # С T-2 (2026-09-28) baseline пуст: любое новое нарушение knip красит прогон.
      # scripts/knip-baseline.txt остаётся механизмом, а не складом долга.
      run: node scripts/knip-check.mjs
    - name: Cross-feature ratchet (AUDIT-part3 9, v2 detection)
      run: bash scripts/cross-feature-check.sh
    - name: Raw overlay gate (AUDIT-part2 3.1, AG-GATE-1)
      run: bash scripts/raw-overlay-check.sh
    # MF-18 (SA-1): var(--x) без объявления в index.css = прозрачный фон/пустое значение.
    - name: Undeclared CSS variables gate (MF-18)
      run: node scripts/check-undefined-css-vars.mjs
    # MF-24 (SA-14): в мобильных компонентах — только слоты темы (или `color-ok:` с причиной).
    - name: Mobile hard-coded colour gate (MF-24)
      run: node scripts/check-mobile-colors.mjs
    - run: npm run test:ci
    # S-42.3: каждый паттерн детектора кризиса держится хотя бы одной фразой корпуса.
    - name: Crisis pattern coverage (S-42)
      run: npx tsx scripts/crisis-pattern-coverage.mjs
    # EA-8: браузер ставится ДО сборки — иначе пререндер внутри build молча
    # пропускался, и бюджет размера мерил не ту сборку, что уезжает на сервер.
    - name: Install Playwright
      run: npx playwright install --with-deps chromium
    - run: npm run build
    - name: Bundle size report
      run: |
        echo "=== Bundle size report ==="
        ls -lh dist/assets/*.js | awk '{print $5, $9}' | sort -rn | head -15
    - name: Bundle size budget
      run: |
        # Храповик, а не цель: 720000 — фактический вес на 2026-08-23 (712700)
        # с округлением вверх до 10 КБ. Снижен с 810000 после DEBT-1: из index-чанка
        # ушли переводы второстепенных i18n-пространств и два модальных окна
        # (React.lazy), плюс дерево Firebase. Порог только опускать.
        # Порог по сырым байтам. 2026-08-25: пересчитан от факта.
        # Прежние 720000 были поставлены 2026-08-23 (ba73b86b) НИЖЕ реального
        # размера — сборка в тот же день весила 720301, и гейт не проходил
        # ни разу: CI на main был красным подряд от него, а не от роста бандла.
        # Порог от замера 720507 + ~2% запаса. Основной размерный гейт —
        # gzip ниже (225000 при факте 210583): к людям едет он, сырые байты
        # держим за цену разбора. Поднимать этот порог можно только вместе с
        # замером и строкой о том, что именно выросло.
        # 2026-09-03: 735000 → 750000. Факт 738278 против 720301, когда порог
        # ставили: +18 КБ за тринадцать выпусков работы по синхронизации,
        # изоляции аккаунтов и разрешению конфликтов. Проверено, что рост не
        # от заехавшего не туда: minisearch, docx, jspdf, mammoth и posthog
        # в стартовом куске отсутствуют, стенд сбоев в сборку не попал.
        # Gzip при этом 215115 из 225000 — порог, который едет к людям, не
        # тронут и остаётся связывающим.
        # История: 700000 → 750000 → 760000, и на третьем разе вместо
        # четвёртого поднятия сделана работа, о которой там же и было
        # написано: клиент Supabase вынесен из основного куска отдельным
        # vendor-supabase. Кусок упал с 777559 до 560871, сжатый — с 224432
        # до 167883. Потолки опущены вслед за этим: храповик обязан ходить
        # вниз, иначе он перестаёт что-либо держать.
        # 2026-09-24: 600000 → 590000. Кусок дорос до 614762 и уронил CI; вместо
        # поднятия из старта вынесены сервис восстановления ИИ, окно политики и
        # вкладка настроек редактора (lazy) — стало 573915, gzip 169178.
        # 2026-09-28: 590000 → 420000. React (react, react-dom, scheduler) вынесен в
        # vendor-react — он живёт в кэше браузера между выкатками, а index-кусок
        # упал с 601811 до 405021 (gzip 117163). Заодно react-dom 19.3 (+28 КБ)
        # перестал упираться в порог. Храповик опущен вслед за фактом.
        # 2026-10-05 (0.9.30): 420000 → 442000. merge-r5 принёс сегментный формат
        # диалога (dialogueSegments, localStorePages, ветка выгрузки) — это код
        # стартового синхронизатора, он нужен до первой правки, поэтому в index
        # и лёг: 433549 байт, gzip 126184 против 120941 на ветке без синхронного
        # кода. Мёртвый постраничный писатель (R-8) из куска уже удалён — он дал
        # −141 байт, и то не в gzip. Разнести синхронное ядро в отдельный чанк
        # нельзя без проверки прод-сборки в браузере: vite.config хранит память
        # о 0.7.70, где разрез по взаимозависимым модулям дал «Cannot access 'vp'
        # before initialization» в проде. Порог поднят от замера, с запасом ~2%.
        # 2026-10-07 (0.9.32): 442000 → 450000. Факт 439736 (ещё +3 КБ сверху
        # до порога): промпт «Редактора» (PERSONA_PROMPTS тянет в клиент окно
        # описания персоны), очередь окон первого входа, окно «Регистрация».
        # 2026-10-13 (0.9.38): 450000 → 460000. Факт 450088 против 442515 на 0.9.37
        # (+7,6 КБ). Мобильный макет открыт по праву аккаунта (MB-1): раньше при
        # константе 'desktop' сборщик выкидывал BottomNav и мобильные ветки как
        # недостижимые (строки BottomNav в index 0.9.37 нет), теперь они живые. Плюс
        # сам MB: RPC права, история листов (MB-9), портал модалок (MB-4). Gzip
        # 131413 из 131500 — тот порог не тронут и остаётся связывающим.
        MAX_INDEX=460000   # index-*.js fail-порог (байты)
        # R3-045: vendor был только предупреждением, а суммы не мерил никто —
        # новый чанк рос без гейта. 2026-09-30: самый большой vendor 363372
        # (docx), весь JS 3783407 в 97 файлах. Потолки — с запасом ~5–10%.
        MAX_VENDOR=400000  # vendor-*.js fail-порог
        # 2026-10-14 (0.9.39): 4000000 → 4100000. Факт 4013784 против 3994201 на
        # 0.9.38 (+19,6 КБ): мобильный редизайн (MR) — лист диалогов, лист персон,
        # меню «⋯» заметок, компактная корзина, строки статуса в «Профиле»; всё
        # подгружается по требованию, index при этом не вырос (gzip 131177).
        # 2026-10-17 (0.10.0): 4100000 → 4200000, решение владельца. Факт 4121599
        # против 4077516 на 0.9.43 (+44 КБ): ~20 КБ — накладные расходы выноса
        # синхронизации в 20 ленивых кусков (BS/N-2; index −127 КБ, −35 КБ gzip на
        # старте), +6,5 КБ — список 0.10.0 на странице «Что нового», остальное —
        # мелкие экраны пакета N10. Скачиваемое на старте при этом уменьшилось.
        # 2026-11-03 (0.11.5): 4300000 → 4400000, решение владельца. Факт 4310058
        # против 4297945 на 0.11.4 (+12 КБ): клиент SYNC2 (sync_push), мутатор
        # черновика DW-4, правки ИИ; всё ленивое — стартовый gzip 100055.
        MAX_TOTAL_JS=4400000  # сумма dist/assets/*.js fail-порог (4.4M — владелец 2026-11-03 для 0.11.5: 4 310 058)
        MAX_CSS=185000     # *.css fail-порог (байты)
        fail=0
        for f in dist/assets/index-*.js; do
          sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
          echo "index: $f = $sz"
          [ "$sz" -gt "$MAX_INDEX" ] && { echo "::error::$f > $MAX_INDEX"; fail=1; }
        done
        for f in dist/assets/vendor-*.js; do
          sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
          [ "$sz" -gt "$MAX_VENDOR" ] && { echo "::error::$f > $MAX_VENDOR ($sz)"; fail=1; }
        done
        total_js=$(cat dist/assets/*.js | wc -c | tr -d ' ')
        echo "total js: $total_js"
        [ "$total_js" -gt "$MAX_TOTAL_JS" ] && { echo "::error::total js $total_js > $MAX_TOTAL_JS"; fail=1; }
        for f in dist/assets/*.css; do
          sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
          echo "css: $f = $sz"
          [ "$sz" -gt "$MAX_CSS" ] && { echo "::error::$f > $MAX_CSS"; fail=1; }
        done
        # AUDIT-H7: gzip-гейт на САМЫЙ БОЛЬШОЙ index-чанк. Порог от факта
        # 2026-08-24: entry 209.63 KB gzip, запас ~5%. dist/assets/index-*.js
        # матчит два файла — берём max, иначе gzip -c склеит их и посчитает не то.
        # 2026-10-02 (0.9.29): раунд 6 дал +41 байт сверх 121000 (121041) —
        # рост размазан по удалению аккаунта, хранилищу и переводам; порог
        # поднят до факта + ~2%, а не ужат ради одного прогона.
        # 2026-10-05 (0.9.30): 123500 → 128500 — тот же сегментный формат, факт
        # 126184 (см. MAX_INDEX выше).
        # 2026-10-07 (0.9.32): 128500 → 131500 — то же, факт 128539 локально
        # (+~190 в CI); запас ~2%.
        # 2026-10-16 (0.9.43): 131500 → 133000 — решение владельца: правки аудита R7
        # (приватность, согласие, счётчики) и MQ, факт 131693 локально. Временно:
        # задача BS (justwriting-docs/tickets-2026-10-16-BS-start-chunk-split.md)
        # выносит синхронизацию из стартового чанка и возвращает порог вниз.
        # 2026-10-16 (BS/N-2): 133000 → 100000. Движок синка (SyncService,
        # CloudSyncService, LocalStoreSyncService с сегментным форматом диалогов,
        # StorageService, ConflictResolver, EncryptionService, AIEmbeddingService,
        # панель настроек и мост миграции гостя) больше не достижим статическим
        # импортом из main.tsx — храповик в src/test/bootChunkGraph.n2.test.ts.
        # Факт: 95958 gzip (320271 байт) против 131535 на 0.9.43, то есть −35,6 КБ.
        # Запас ~4 %, а не привычные 2 %: в этом же пакете ещё семь тикетов, и
        # каждый добавляет в старт сотни байт (N-1 дал +201). Сузить до факта +2 %
        # можно после приёмки пакета.
        # 2026-11-03 (0.11.5): 100000 → 102000 — решение владельца («поднимай»): на
        # 0.11.4 факт 99683 локально (+~135 в CI), запас ~180 Б — следующий пакет
        # упирался бы в порог. Правило подъёма — AGENTS.md («Бюджет стартового чанка»).
        MAX_INDEX_GZ=102000
        biggest_gz=0
        for f in dist/assets/index-*.js; do
          gz=$(gzip -c "$f" | wc -c)
          [ "$gz" -gt "$biggest_gz" ] && biggest_gz=$gz
        done
        echo "index gzip (largest chunk): $biggest_gz"
        [ "$biggest_gz" -gt "$MAX_INDEX_GZ" ] && { echo "::error::largest index chunk gzip $biggest_gz > $MAX_INDEX_GZ"; fail=1; }
        exit $fail
    - name: E2E test discovery check
      run: |
        OUTPUT=$(npx playwright test --list --project=chromium)
        echo "$OUTPUT"
        echo "$OUTPUT" | grep -q "Total: [1-9][0-9]* tests" || { echo "::error::Playwright test discovery failed or found 0 tests"; exit 1; }
    - name: E2E Tests
      run: npx playwright test --project=chromium
  # Сравнение размера бандла живёт отдельно от гейтов корректности намеренно.
  # Раньше оно стояло в середине job build и переключало checkout на main
  # (git checkout <ref> -- . перезаписывает индекс, поэтому git checkout -- .
  # возвращал base повторно). Всё, что шло после, — бюджет размера, E2E,
  # функции, правила Firestore — проверяло main вместо PR.
  
  rls:
    needs: already-green
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && needs.already-green.outputs.run == '' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Apply schema and run RLS tests
      run: |
        # Все миграции по порядку, а не первые три. Тест проверяет поведение,
        # которое вводится позже: ограничение роли при вставке приходит из
        # 0009, а профиль при регистрации заводит триггер из 0006. С обрезанным
        # набором проверка роли проваливалась, потому что политики из 0009
        # в базе просто не было.
        # psql — внутри контейнера сервиса: порт наружу не публикуется.
        # server_stamp.test.sql идёт третьим не для порядка: он проверяет то, чего
        # ни один юнит-тест не видит, — что метку версии строки ставит база. Вся
        # защита от убежавших часов держится на одном триггере из 0037, а миграции
        # перезаписываются часто; без этой строчки удалённый триггер ронял бы
        # гейты в ноль.
        # drafts_updated_at.test.sql — 0043: метку черновика ставит сервер (дейлик 28.10
        # DY8-6: тест был, но не подключён — снятый триггер не ронял ничего).
        # feature_flags.test.sql — RP-3 (0046): флаг «владельцу / всем / никому» отдаёт
        # база; таблица закрыта для клиентов.
        # mobile_layout_access.test.sql — MB-1: право на мобильный макет отдаёт база
        # (0041), и это единственное место, где видно, что ветка служебных аккаунтов
        # в функции есть, а у anon права на исполнение нет.
        # sync_push.test.sql — SYNC2 (0047): запись с проверкой базы, надгробия ИИ-записей,
        # прибавки с op_id; слепой upsert старого клиента поверх надгробия отказывает.
        { for f in supabase/tests/_auth_setup.sql supabase/migrations/*.sql supabase/tests/rls.test.sql supabase/tests/server_stamp.test.sql supabase/tests/drafts_updated_at.test.sql supabase/tests/mobile_layout_access.test.sql supabase/tests/feature_flags.test.sql supabase/tests/sync_push.test.sql; do cat "$f"; echo; done; } \
          | docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1
    # DY10-5 (дейлик 30.10, «го» владельца): стражи номера rev (0045) — не остался
    # ли null, не сдвинулись ли метки времени при заполнении, нет ли default у
    # колонки и прав клиентов на sync_rev_seq; и два сеанса (замок пользователя,
    # без взаимоблокировки). В общий поток не встраиваются: тест заново применяет
    # 0045 через \ir, а проверке замков нужен второй сеанс. База — та же, что
    # выше: миграции уже применены.
    - name: sync_rev guards (0045)
      run: |
        set -euo pipefail
        PG="${{ job.services.postgres.id }}"
        docker cp supabase "$PG:/tmp/supabase"
        docker exec -i "$PG" psql -U postgres -v ON_ERROR_STOP=1 -f /tmp/supabase/tests/sync_rev.test.sql
        SYNC_REV_PSQL="docker exec -i $PG psql -U postgres" bash supabase/tests/sync_rev_concurrency.sh
        # SYNC2 (0047): два сеанса пишут одну строку с одной базой — ложится ровно один.
        SYNC_REV_PSQL="docker exec -i $PG psql -U postgres" bash supabase/tests/sync_push_concurrency.sh

  # MB-12: мобильные спеки (e2e/mobile/*.spec.ts) под проектом Mobile Chrome.
  # Отдельный джоб, а не шаг в build: спекам нужен живой стек (мобильный макет
  # открывается по праву аккаунта, MB-1, а право даёт база), то есть локальный
  # стенд (docker на машине GitHub есть).
  # Mobile Safari (WebKit) НЕ включён: ни одна спека этой партии не снималась в
  # WebKit, а единственная известная WebKit-разница (F-20, чтение `users` после
  # входа) сначала проверяется ревьюером на проде — см. MX-6.
  mobile-e2e:
    needs: already-green
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && needs.already-green.outputs.run == '' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    # Мобильный набор — самый долгий джоб (минуты GitHub). Он нужен, когда
    # меняется то, что видит телефон или чем стенд поднимается; правки документов,
    # других воркфлоу и одних только vitest-тестов его не задевают. Ручной запуск
    # и push без известной базы гоняют его всегда. Решает scripts/ci/e2e-gate.sh.
    - name: Does this push touch the app?
      id: gate
      run: |
        # Ветка — против своей базы на main, а не против прошлого push (31.10).
        OUT=$(bash scripts/ci/e2e-gate.sh "${{ github.event_name }}" "${{ github.ref }}" "${{ github.event.before }}" "${{ github.sha }}")
        echo "$OUT" >> "$GITHUB_OUTPUT"
        if [ "$OUT" = "run=false" ]; then echo "::notice::мобильный e2e пропущен: приложение в этой ветке не менялось"; fi
    - name: Use Node.js
      if: steps.gate.outputs.run == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        cache: npm
    - if: steps.gate.outputs.run == 'true'
      run: npm ci
    - name: Install Playwright (Chromium — проект Mobile Chrome)
      if: steps.gate.outputs.run == 'true'
      run: npx playwright install --with-deps chromium
    - name: Mobile e2e discovery check
      if: steps.gate.outputs.run == 'true'
      # Тот же guarding шаг, что «E2E test discovery check» выше: --list ловит и
      # мобильные спеки, иначе опечатка в testMatch обходится «зелёным» CI без
      # единого теста.
      run: |
        OUTPUT=$(npx playwright test -c playwright.mobile.config.ts --project="Mobile Chrome" --list)
        echo "$OUTPUT"
        echo "$OUTPUT" | grep -q "Total: [1-9][0-9]* tests" || { echo "::error::мобильные спеки не находятся (0 тестов)"; exit 1; }
        N=$(echo "$OUTPUT" | sed -n 's/.*Total: \([0-9]*\) tests.*/\1/p')
        # MR-12: после MR-пакета 2026-10-13 мобильный набор — 16 файлов и 47
        # тестов (MR-1…MR-11 плюс перенумерованные MB-спеки). Порог 12 был из
        # MB-2…MB-11 и перестал ловить потерю целой группы.
        [ "$N" -ge 40 ] || { echo "::error::мобильных тестов $N, ожидалось не меньше 40 (MB-2…MB-11, MR-1…MR-11)"; exit 1; }
    - name: Mobile e2e on the stand
      if: steps.gate.outputs.run == 'true'
      run: bash scripts/ci/mobile-e2e.sh
    # Снимки упавших мобильных тестов: без них разбор падения в CI шёл вслепую
    # (0.9.39: «блок за левым краем» на 360 — что за блок, видно только на снимке).
    - name: Upload mobile e2e failures
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: mobile-e2e-failures
        path: test-results/
        retention-days: 7

  # R5-008: джоб только для PR не от Dependabot. Сегодня таких нет (владелец
  # пушит в main), поэтому он не исполнялся ни разу — но и не мёртв: первый
  # же PR человека (репозиторий готовится к публичности) его запустит.
  # Размерный гейт каждого push — «Bundle size budget» в build; здесь лишь
  # сравнение с базой PR.
  bundle-size:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'   # тот же мажор, что и в job build
        cache: 'npm'

    # M-5: без playwright предрендер в CI бросает (prerender.ts, L-9). Здесь он
    # не нужен — сравниваются только dist/assets, их предрендер не меняет.
    - name: Build PR
      run: |
        npm ci
        CI= npm run build
        mkdir -p /tmp/current-dist
        cp -r dist/assets/* /tmp/current-dist/

    - name: Build base in a separate worktree
      run: |
        git worktree add /tmp/base "origin/${{ github.base_ref }}"
        cd /tmp/base
        npm ci
        CI= npm run build
        mkdir -p /tmp/base-dist
        cp -r /tmp/base/dist/assets/* /tmp/base-dist/

    - name: Compare
      run: npx tsx scripts/bundle-compare.ts /tmp/base-dist /tmp/current-dist
