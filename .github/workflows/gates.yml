name: Testability Gates (Mutations, Proofs, Live DB)

# TB-04: Ворота проверяемости. Запускаются по требованию (workflow_dispatch),
# при пуше тега релиза (v*) и по расписанию — один джоб. Расписание только на
# своём раннере (VPS): платные минуты GitHub для этого не расходуются.
# R4-065: параллельные запуски на одном self-hosted раннере воюют за порты
# 5439/5440 и каталоги /tmp — один прогон за раз.
concurrency:
  group: gates
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  schedule:
    # R5-013/R5-053: GitHub доставляет schedule с опозданием на часы (30.09:
    # слот 03:17Z пришёл в 09:43Z) и может не доставить вовсе. «Раз в сутки» —
    # обещание по возможности; пропуск ловит scripts/ci/gates-freshness.mjs
    # (::warning:: в выкатке: секреты старше 2 суток, тяжёлые ворота — 8).
    # B-4 (R2-017): полная история на секреты, раз в сутки. Push-гейт в ci.yml
    # смотрит диапазон выкладки, и промежуточные коммиты force-push туда не
    # попадают никогда. 03:17 UTC — не круглое время, чтобы не попадать в пик
    # очередей раннера.
    - cron: '17 3 * * *'
    # R3-017 (a): тяжёлые ворота (мутации, доказательства, живая база) раз в
    # неделю, в ночь на понедельник по Екатеринбургу. Тегов релиза нет, и
    # ручной пуск забывался: с 29.09 свип не гонялся ни разу.
    - cron: '47 21 * * 0'

permissions:
  contents: read

jobs:
  secrets_history:
    name: Full-history secret scan (B-4 / R2-017)
    # Тот же зафиксированный gitleaks, что и у push-гейта: версия, sha256 и
    # запуск живут в scripts/gitleaks-scan.sh, чтобы пин при подъёме не
    # разъезжался между двумя workflow.
    #
    # Сканируется вся история (`--all`), и сегодня она зелёная только потому,
    # что две известные находки внесены в .gitleaksignore точечно —
    # fingerprint’ом конкретного коммита и строки. Путь в allowlist заглушил бы
    # и будущий настоящий ключ. Красный прогон = в истории появилось то, чего
    # там быть не должно.
    runs-on: [self-hosted, justwriting-vps]
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Без полной истории нечего сканировать: на глубине 1 один коммит.
          fetch-depth: 0

      - name: gitleaks --all
        run: bash scripts/gitleaks-scan.sh "--all"

  gates:
    name: Testability & Mutations Gates
    # Каждый день — только полная история секретов: гонять сорокаминутный
    # прогон мутаций и живых БД ежедневно — это и ресурсы раннера, и шум в
    # отчётах вместо сигнала. Раз в неделю — да (см. второй cron).
    if: github.event_name != 'schedule' || github.event.schedule == '47 21 * * 0'
    runs-on: [self-hosted, justwriting-vps]
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 1. Mutation suite (--check)
        run: bash scripts/test-audit-mutations.sh --check

      - name: 1b. Sync mutation sweep
        run: npm run sweep:sync

      - name: 2. Audit proofs
        run: bash scripts/audit-proofs.sh

      - name: 3. Live database checks (Canary, Postulates, Account Deletion, Pool Deadlock)
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::Docker is not available on this runner. Live database checks require Docker."
            exit 1
          fi

          echo "Starting Postgres 16 container..."
          CONTAINER_NAME="jw-gate-postgres-${GITHUB_RUN_ID:-local}"
          docker run --name "$CONTAINER_NAME" -d -p 127.0.0.1:5439:5432 -e POSTGRES_PASSWORD=postgres postgres:16

          cleanup() {
            echo "Cleaning up Postgres container..."
            docker rm -f "$CONTAINER_NAME" || true
          }
          trap cleanup EXIT

          echo "Waiting for Postgres to become ready..."
          # По TCP: временный сервер initdb слушает только сокет и потом перезапускается.
          until docker exec "$CONTAINER_NAME" pg_isready -h 127.0.0.1 -U postgres; do
            sleep 1
          done

          echo "Applying migrations and RLS test fixtures..."
          docker exec -i "$CONTAINER_NAME" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/_auth_setup.sql
          for f in supabase/migrations/*.sql; do
            docker exec -i "$CONTAINER_NAME" psql -U postgres -v ON_ERROR_STOP=1 < "$f"
          done
          docker exec -i "$CONTAINER_NAME" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/rls.test.sql

          # Триггер из 0037 — единственное, что мешает устройству с убежавшими
          # часами выиграть спор отметок. Юнит-тесты работают с подставной базой и
          # его отсутствия не заметят; этот шаг падает, если триггер снять.
          docker exec -i "$CONTAINER_NAME" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/server_stamp.test.sql

          export DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5439/postgres"

          echo "TB-02/TB-03 Step A: Injecting canary..."
          docker exec -i "$CONTAINER_NAME" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/postulates_canary.sql

          echo "Running postulates with canary (MUST fail exit 1)..."
          set +e
          CANARY_OUTPUT=$(node scripts/postulates.mjs --require-db 2>&1)
          CANARY_RC=$?
          set -e

          if [ $CANARY_RC -eq 0 ]; then
            echo "::error::Postulates passed when canary was present! It must fail on unencrypted Cyrillic text."
            exit 1
          fi

          if ! echo "$CANARY_OUTPUT" | grep -q "documents"; then
            echo "::error::Postulates failed but did not name the canary table (documents)."
            echo "$CANARY_OUTPUT"
            exit 1
          fi
          echo "Canary caught successfully: exit code $CANARY_RC, documents table named."

          echo "TB-02/TB-03 Step B: Removing canary..."
          docker exec -i "$CONTAINER_NAME" psql -U postgres -v ON_ERROR_STOP=1 -c "DELETE FROM public.documents WHERE user_id = 'c0000000-0000-0000-0000-000000000001'; DELETE FROM auth.users WHERE id = 'c0000000-0000-0000-0000-000000000001';"

          echo "Running postulates without canary (MUST exit 0)..."
          node scripts/postulates.mjs --require-db --max-unmeasured 0

          echo "TB-08 Part B: Running live DB deleteAccount + pool deadlock + V-3 admin delete + V-5 counters tests..."
          JW_THROWAWAY_DB=1 npx vitest run api/__tests__/deleteAccount.db.test.ts api/__tests__/aiPoolDeadlock.db.test.ts api/__tests__/adminDeleteUser.db.test.ts api/__tests__/documentCounters.db.test.ts \
            --reporter=json --outputFile=$RUNNER_TEMP/jw-db-tests.json
          # Гейт не проходит вслепую: без throwaway-базы эти тесты skipIf'ятся,
          # и «0 пройдено» — красный, а не зелёный.
          node -e "const r=require(process.env.RUNNER_TEMP + '/jw-db-tests.json'); if (!(r.numPassedTests>=5)) { console.error('::error::живые тесты БД не выполнились (пройдено '+r.numPassedTests+' из '+r.numTotalTests+') — JW_THROWAWAY_DB/DATABASE_URL не выставлены?'); process.exit(1) } console.log('живых тестов БД пройдено:', r.numPassedTests)"

      # F-3: живой сквозной сценарий смены аккаунта на локальном стенде
      # (Postgres + GoTrue + PostgREST в docker, Vite и прокси на :3000).
      # Порты стенда не пересекаются с шагом 3 (5439) и с продом на этом же VPS:
      # прод-сервисы слушают 127.0.0.1 (API — :3000!), а стенд — свои
      # 3100/3010/9999/3003/5440. Если что-то из них занято — переопределить
      # STAND_*_PORT ниже. Раннер свой и постоянный: chromium остаётся в
      # ~/.cache/ms-playwright между прогонами, install — холостой после первого.
      - name: 4. Account switch e2e (stand)
        # :3000 на этом VPS занят продовым API (justwriting.service) — стенд
        # на своём порту, иначе проверки и браузер ушли бы в прод.
        env:
          STAND_PORT: "3100"
          STAND_URL: "http://localhost:3100"
        run: |
          npx playwright install chromium
          trap 'bash scripts/stand/down.sh' EXIT
          bash scripts/stand/up.sh
          npx playwright test -c playwright.stand.config.ts

