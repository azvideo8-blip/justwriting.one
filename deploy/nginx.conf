# deploy/nginx.conf — reverse proxy for justwriting on VPS
# Ported from vercel.json headers and rewrites.
# TLS termination assumed via certbot/Let's Encrypt at /etc/nginx/snippets/ssl.conf.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # ── Upstream: Node API process ──────────────────────────────────────
    upstream justwriting_api {
        server 127.0.0.1:3000;
    }

    # ── Redirect HTTP → HTTPS ──────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ──────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS — uncomment and adjust after certbot
        # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
        # include             /etc/nginx/snippets/ssl.conf;

        root /var/www/justwriting/dist;
        index index.html;

        # ── Global: X-Content-Type-Options (vercel.json L13-17) ────────
        add_header X-Content-Type-Options "nosniff" always;

        # ── Block .map files (vercel.json L8) ──────────────────────────
        location ~ \.map$ {
            return 404;
        }

        # ── Service Worker: NEVER cache (vercel.json L19-23) ───────────
        # A stuck service worker holds an old bundle — this was the
        # "заметки пропали" incident.
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files /sw.js =404;
        }

        # ── Static assets: immutable long cache (vercel.json L25-29) ───
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # ── API proxy ──────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://justwriting_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── SPA fallback + security headers (vercel.json L31-67) ───────
        # All headers from the SPA block in vercel.json, line by line.
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            # CSP — verbatim from vercel.json L65.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://lh3.googleusercontent.com https://www.google.com; connect-src 'self' https://firestore.googleapis.com https://firebase.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://gen-lang-client-0751626072.firebaseio.com wss://gen-lang-client-0751626072.firebaseio.com https://us-central1-gen-lang-client-0751626072.cloudfunctions.net https://firebaseappcheck.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.google.com https://o4509237484238848.ingest.us.sentry.io https://eu.i.posthog.com https://app.posthog.com; frame-src 'self' https://gen-lang-client-0751626072.firebaseapp.com https://www.google.com https://recaptcha.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
