# deploy/nginx.conf — justwriting on the VPS
#
# Goes to /etc/nginx/sites-available/justwriting, symlinked into sites-enabled.
# This is a site config, not a whole nginx.conf: the http{} block belongs to the
# distribution's file and is not repeated here.
#
# Everything the app talks to is same-origin. Supabase (Kong) and the AI service
# listen on 127.0.0.1 only — deliberately, because Docker publishes ports ahead
# of the ufw chains and anything it binds to 0.0.0.0 is on the internet whatever
# ufw says. nginx is the only way in.

upstream supabase_kong { server 127.0.0.1:8000; }
upstream justwriting_api { server 127.0.0.1:3000; }

# ── Rate limiting zones ─────────────────────────────────────────────────────
# /auth/ — strict limit to protect against password brute-force and credential stuffing
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# /api/ — general API limit to protect AI budget and prevent DoS (allows burst for batch operations)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
# R5-011: /ready — своя зона. В общей api_limit частые проверки монитора и
# смоука съедали лимит чата того же IP, и наоборот.
limit_req_zone $binary_remote_addr zone=ready_limit:1m rate=30r/m;
# SA-3: /rest/ был единственном путём в базу без ограничения частоты. Замер по
# журналу доступа за 14 дней (13.09–27.09): пик одного IP — 193 запроса/мин
# (это прогоны индексации эмбеддингов), типичный рабочий час — 45-53/мин, у
# легитимных клиентов всего 2-3 IP (остальные 73 — сканеры вроде `/rest/.env`).
# 193 × 5 = 965 → 1000r/m; burst закрывает секундную неравномерность того же
# прогона индексации.
limit_req_zone $binary_remote_addr zone=rest_limit:10m rate=1000r/m;
# /realtime/ — только рукопожатия: за месяц ни один IP не сделал больше
# 2 подключений/мин (соединение живёт долго, запросов в секунду здесь нет).
# 2 × 5 = 10.
limit_req_zone $binary_remote_addr zone=realtime_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=realtime_conn:10m;

limit_req_status 429;

# R4-8: одноразовые токены из писем (сброс пароля, приглашение, вход по ссылке)
# приходят в строке запроса — в журнал доступа их не пишем.
map $request_uri $jw_loggable {
    ~*[?&](token_hash|token|code)=  0;
    default                        1;
}

# ── HTTP: ACME, then everything to HTTPS ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name justwriting.ru www.justwriting.ru justwriting.online www.justwriting.online;

    # certbot --webroot writes here; must stay reachable over plain HTTP or
    # renewal fails and the site goes down 90 days later.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # L-7 (R4-059): это единственный (и потому default) :80 server. Прежний
    # 301 на $host отражал любой чужой Host-заголовок обратно — открытый
    # редиректор. Канонический адрес, как в блоках ниже.
    server_tokens off;
    location / { return 301 https://justwriting.ru$request_uri; }
}

# ── justwriting.online → justwriting.ru ─────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name justwriting.online www.justwriting.online;

    ssl_certificate     /etc/letsencrypt/live/justwriting.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/justwriting.online/privkey.pem;
    # L-7 (R4-060): версия nginx не называется наружу.
    server_tokens off;
    # Spelled out rather than `include options-ssl-nginx.conf`: that file is
    # written by certbot's nginx plugin, and the certificates here were issued
    # with `certonly --webroot`, so it does not exist. An include of a missing
    # file is a hard nginx failure, not a warning.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # SB-8: этот блок отдаёт не только 301 — см. sw.js ниже. Заголовки нужны и
    # здесь, иначе ответ с содержимым уходит без HSTS и без nosniff.
    include snippets/security-headers.conf;

    # Выключатель для служебного работника, оставшегося от прежних заходов на
    # www. Отдаём его ДО общего перенаправления: 301 на sw.js браузер для
    # обновления работника не принимает, и старая сборка жила бы вечно.
    location = /sw.js {
        alias /var/www/www-killswitch/sw.js;
        # Свой add_header ниже отменяет наследование заголовков уровня server —
        # snippet подключается и здесь (AU-3). Content-Type не добавляем:
        # mime.types знает .js, а дубль заголовка ломал ответ (L-7, R4-061).
        include snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location / {
        return 301 https://justwriting.ru$request_uri;
    }
}

# ── www → без www ───────────────────────────────────────────────────────────
# Приложение обращается к своему API по абсолютному адресу https://justwriting.ru.
# Если страницу открыть на www, источник страницы и источник запроса перестают
# совпадать, и CSP (connect-src 'self') рубит вход и регистрацию. Один
# канонический адрес — и такого класса ошибок больше нет.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.justwriting.ru;

    ssl_certificate     /etc/letsencrypt/live/justwriting.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/justwriting.ru/privkey.pem;
    # L-7 (R4-060): версия nginx не называется наружу.
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # SB-8: как и в блоке .online — здесь тоже отдаётся sw.js, а не только 301.
    include snippets/security-headers.conf;

    # Выключатель для служебного работника, оставшегося от прежних заходов на
    # www: 301 на sw.js браузер для обновления работника не принимает, и старая
    # сборка из его кэша жила бы вечно.
    location = /sw.js {
        alias /var/www/www-killswitch/sw.js;
        include snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location / {
        return 301 https://justwriting.ru$request_uri;
    }
}

# ── the app ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name justwriting.ru;

    ssl_certificate     /etc/letsencrypt/live/justwriting.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/justwriting.ru/privkey.pem;
    # Spelled out rather than `include options-ssl-nginx.conf`: that file is
    # written by certbot's nginx plugin, and the certificates here were issued
    # with `certonly --webroot`, so it does not exist. An include of a missing
    # file is a hard nginx failure, not a warning.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # L-7 (R4-060): версия nginx не называется наружу.
    server_tokens off;

    root /var/www/justwriting;

    access_log /var/log/nginx/access.log combined if=$jw_loggable;

    # Служебное и временное наружу не уходит: .env, .git/, index.html.prev и
    # sw.js.prev от ролбэка, редакторские своп-файлы.
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~ \.(prev|bak|old|orig|save|swp|log|sha256)$ { return 404; }
    index index.html;

    client_max_body_size 10m;   # note bodies and exports
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include snippets/security-headers.conf;

    # ── Supabase, same-origin ───────────────────────────────────────────────
    # R7F-007: точки GoTrue `/otp`, `/magiclink` и `/resend` приложение не зовёт
    # (проверено grep'ом по src: `signInWithOtp`, `magiclink`, `.resend(` — пусто),
    # но под публичным anon-ключом они отвечают и дают две вещи, которых у сервиса
    # быть не должно: оракул существования адреса («известный адрес → 200 +
    # письмо») и отправку настоящих писем сервиса любому из пользователей по
    # требованию. Закрываем здесь, а не в GoTrue: `disable_signup` уже стоит, а
    # `/otp` живёт независимо от него (на проде проверено: 422 `signup_disabled`
    # на неизвестный адрес, то есть точка работает).
    #
    # Точное совпадение (`location =`) важнее регулярки ниже по правилам nginx,
    # поэтому порядок блоков роли не играет; пути перечислены явно.
    location = /auth/v1/otp       { return 404; }
    location = /auth/v1/magiclink { return 404; }
    location = /auth/v1/resend    { return 404; }

    # Supabase Auth: strict rate limiting against password brute-force and credential stuffing
    location ~ ^/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://supabase_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase Rest, Realtime (not subject to strict auth rate limit).
    # Storage приложение не использует (0 бакетов) — наружу не открываем.
    # SA-3: /rest/ — прямой доступ к таблице под ролями anon/authenticated, и
    # до замера единственным ограничением здесь был потолок Kong. Разделено на
    # два location: у /realtime/ свои настройки websocket и совсем другой
    # профиль трафика (одно долгое соединение вместо тысяч запросов).
    location ~ ^/rest/ {
        limit_req zone=rest_limit burst=100 nodelay;
        proxy_pass http://supabase_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/realtime/ {
        limit_req zone=realtime_limit burst=5 nodelay;
        limit_conn realtime_conn 10;
        proxy_pass http://supabase_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime is websockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Studio is NOT exposed. Reach it over an ssh tunnel:
    #   ssh -L 8000:127.0.0.1:8000 justwriting

    # ── AI service ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://justwriting_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A chat completion runs well past the default 60s, and streaming must
        # not be held in a buffer or the user watches nothing happen.
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # L-7 (R4-062): /ready раньше отвечал 200 text/html от SPA — внешний
    # монитор не мог увидеть зависший пул БД. Проксируем к API: 200 JSON,
    # когда зависимости живы, 503 — когда нет.
    # M-7: публичный, и каждый запрос — SELECT 1 из пула на 10 соединений:
    # без лимита его можно выбрать до дна.
    location = /ready {
        limit_req zone=ready_limit burst=10 nodelay;
        proxy_pass http://justwriting_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── static ──────────────────────────────────────────────────────────────
    # Source maps are built as 'hidden' but must never be served.
    location ~ \.map$ { return 404; }

    # A stuck service worker keeps an old bundle alive; that is the "мои заметки
    # пропали" incident. Never cache it.
    location = /sw.js {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # EA-12: CSP сервис-воркера берётся из заголовков самого sw.js, а не страницы.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'" always;
        try_files /sw.js =404;
    }

    location /assets/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── SPA ─────────────────────────────────────────────────────────────────
    location / {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        # CSP rewritten for this stack. Supabase and the AI service are
        # same-origin through the proxies above, so 'self' covers them and no
        # Firebase or reCAPTCHA origin is listed any more — App Check went with
        # Firebase. No external origins needed: fonts are self-hosted, analytics
        # and third-party error tracking are removed.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;

        try_files $uri $uri/ /index.html;
    }
}
