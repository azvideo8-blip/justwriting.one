# deploy/nginx.conf — justwriting on the VPS
#
# Goes to /etc/nginx/sites-available/justwriting, symlinked into sites-enabled.
# This is a site config, not a whole nginx.conf: the http{} block belongs to the
# distribution's file and is not repeated here.
#
# Everything the app talks to is same-origin. Supabase (Kong) and the AI service
# listen on 127.0.0.1 only — deliberately, because Docker publishes ports ahead
# of the ufw chains and anything it binds to 0.0.0.0 is on the internet whatever
# ufw says. nginx is the only way in.

upstream supabase_kong { server 127.0.0.1:8000; }
upstream justwriting_api { server 127.0.0.1:3000; }

# ── Rate limiting zones ─────────────────────────────────────────────────────
# /auth/ — strict limit to protect against password brute-force and credential stuffing
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# /api/ — general API limit to protect AI budget and prevent DoS (allows burst for batch operations)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

limit_req_status 429;

# ── HTTP: ACME, then everything to HTTPS ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name justwriting.ru www.justwriting.ru justwriting.online www.justwriting.online;

    # certbot --webroot writes here; must stay reachable over plain HTTP or
    # renewal fails and the site goes down 90 days later.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# ── justwriting.online → justwriting.ru ─────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name justwriting.online www.justwriting.online;

    ssl_certificate     /etc/letsencrypt/live/justwriting.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/justwriting.online/privkey.pem;
    # Spelled out rather than `include options-ssl-nginx.conf`: that file is
    # written by certbot's nginx plugin, and the certificates here were issued
    # with `certonly --webroot`, so it does not exist. An include of a missing
    # file is a hard nginx failure, not a warning.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Выключатель для служебного работника, оставшегося от прежних заходов на
    # www. Отдаём его ДО общего перенаправления: 301 на sw.js браузер для
    # обновления работника не принимает, и старая сборка жила бы вечно.
    location = /sw.js {
        alias /var/www/www-killswitch/sw.js;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-store";
    }

    location / {
        return 301 https://justwriting.ru$request_uri;
    }
}

# ── www → без www ───────────────────────────────────────────────────────────
# Приложение обращается к своему API по абсолютному адресу https://justwriting.ru.
# Если страницу открыть на www, источник страницы и источник запроса перестают
# совпадать, и CSP (connect-src 'self') рубит вход и регистрацию. Один
# канонический адрес — и такого класса ошибок больше нет.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.justwriting.ru;

    ssl_certificate     /etc/letsencrypt/live/justwriting.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/justwriting.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Выключатель для служебного работника, оставшегося от прежних заходов на
    # www: 301 на sw.js браузер для обновления работника не принимает, и старая
    # сборка из его кэша жила бы вечно.
    location = /sw.js {
        alias /var/www/www-killswitch/sw.js;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-store";
    }

    location / {
        return 301 https://justwriting.ru$request_uri;
    }
}

# ── the app ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name justwriting.ru;

    ssl_certificate     /etc/letsencrypt/live/justwriting.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/justwriting.ru/privkey.pem;
    # Spelled out rather than `include options-ssl-nginx.conf`: that file is
    # written by certbot's nginx plugin, and the certificates here were issued
    # with `certonly --webroot`, so it does not exist. An include of a missing
    # file is a hard nginx failure, not a warning.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/justwriting;

    # Служебное и временное наружу не уходит: .env, .git/, index.html.prev и
    # sw.js.prev от ролбэка, редакторские своп-файлы.
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~ \.(prev|bak|old|orig|save|swp|log|sha256)$ { return 404; }
    index index.html;

    client_max_body_size 10m;   # note bodies and exports
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;

    # ── Supabase, same-origin ───────────────────────────────────────────────
    # Supabase Auth: strict rate limiting against password brute-force and credential stuffing
    location ~ ^/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://supabase_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase Rest, Realtime, Storage (not subject to strict auth rate limit)
    location ~ ^/(rest|realtime|storage)/ {
        proxy_pass http://supabase_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime is websockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Studio is NOT exposed. Reach it over an ssh tunnel:
    #   ssh -L 8000:127.0.0.1:8000 justwriting

    # ── AI service ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://justwriting_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A chat completion runs well past the default 60s, and streaming must
        # not be held in a buffer or the user watches nothing happen.
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # ── static ──────────────────────────────────────────────────────────────
    # Source maps are built as 'hidden' but must never be served.
    location ~ \.map$ { return 404; }

    # A stuck service worker keeps an old bundle alive; that is the "мои заметки
    # пропали" incident. Never cache it.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /sw.js =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── SPA ─────────────────────────────────────────────────────────────────
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # CSP rewritten for this stack. Supabase and the AI service are
        # same-origin through the proxies above, so 'self' covers them and no
        # Firebase or reCAPTCHA origin is listed any more — App Check went with
        # Firebase. What is left of the outside world: Google Fonts (still loaded
        # from Google's CDN by index.html), PostHog and Sentry.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;

        try_files $uri $uri/ /index.html;
    }
}
