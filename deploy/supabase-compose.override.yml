# Ничего из этой сборки не должно быть доступно из интернета напрямую.
#
# Docker публикует порты, вписывая правила в iptables ДО цепочек ufw, поэтому
# "ufw deny" такие порты не закрывает: список разрешений в ufw к ним просто не
# применяется. Единственная надёжная защита — привязка к 127.0.0.1.
#
# Kong привязан через KONG_HTTP_PORT/KONG_HTTPS_PORT в .env (эти переменные
# больше нигде не используются). Здесь — supavisor, чей POSTGRES_PORT зашит во
# внутренние строки подключения и потому менять его нельзя.
#
# !override заменяет список портов целиком: без него Compose дописал бы наши
# привязки к исходным, оставив 0.0.0.0 открытым.
services:
  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543"

  # Письма на русском (с английским текстом ниже — язык получателя сервер не
  # знает) и от лица сервиса. Заводские шаблоны GoTrue англоязычные
  # и безымянные («Confirm Your Email» неизвестно от кого) — такое письмо и
  # человек, и спам-фильтр воспринимают одинаково плохо. Шаблоны лежат в
  # репозитории (public/email) и раздаются с нашего же домена; GoTrue берёт их
  # по URL при отправке, так что выкатка клиента обновляет и письма.
  auth:
    environment:
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "justwriting — подтвердите адрес / confirm your address"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "justwriting — смена пароля / password reset"
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "justwriting — вход / sign in"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "justwriting — смена адреса / email change"
      GOTRUE_MAILER_SUBJECTS_INVITE: "justwriting — приглашение / invitation"
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: "https://justwriting.ru/email/confirm.html"
      GOTRUE_MAILER_TEMPLATES_RECOVERY: "https://justwriting.ru/email/recovery.html"
      GOTRUE_MAILER_TEMPLATES_INVITE: "https://justwriting.ru/email/invite.html"
      GOTRUE_DISABLE_SIGNUP: "true"
      # 27.10 (владелец): тот же минимум, что у клиента (MIN_PASSWORD_LENGTH = 8).
      # Без этого GoTrue по умолчанию принимал 6 — прямой запрос мимо формы.
      # Действует на установку и смену пароля; вход с прежним паролем не трогает.
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      # 30.10 (владелец): ссылки из писем живут 3 дня (по умолчанию сутки) —
      # приглашение переживает выходные. Настройка одна на все письма, сброс
      # пароля тоже 3 дня (выбор владельца: 7 дней для сброса — слишком долго).
      # На стенде GoTrue 2.189: 604800 принимается, 2 дня — ок, 8 — otp_expired.
      GOTRUE_MAILER_OTP_EXP: "259200"
      # Проверка безопасности 30.10: за 3 дня 6-значный код из письма легче
      # подобрать. Код 10 знаков; наши письма шлют только ссылку (TokenHash),
      # длина кода их не меняет. На стенде GoTrue 2.189: длина 10, ссылка есть.
      GOTRUE_MAILER_OTP_LENGTH: "10"
      GOTRUE_RATE_LIMIT_HEADER: "X-Real-IP"
      # R7F-007: телефонное направление выключено совсем — SMS-провайдера нет,
      # телефонов у пользователей нет, а `external.phone: true` + 
      # `phone_autoconfirm: true` (проверено на проде через /auth/v1/settings)
      # означают, что при первом же включении регистрации телефонные аккаунты
      # создавались бы без подтверждения.
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"

  # Без этого Kong подменяет X-Real-IP своим видом адреса — адресом nginx, и
  # лимиты GoTrue (GOTRUE_RATE_LIMIT_HEADER выше) снова общие на всех. Kong
  # слушает только 127.0.0.1 (KONG_HTTP_PORT в .env), до него дотягивается лишь
  # nginx, поэтому доверять пришедшему X-Real-IP можно от любого адреса.
  kong:
    environment:
      KONG_TRUSTED_IPS: "0.0.0.0/0,::/0"
      KONG_REAL_IP_HEADER: "X-Real-IP"
